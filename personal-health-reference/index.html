
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Health Reference</title>
<style>
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --border: #E1E4EA;
    --border-strong: #C7CCD4;
    --text: #161B22;
    --text-secondary: #5B6472;
    --text-tertiary: #8A93A0;
    --accent: #2A6F6F;
    --accent-soft: #E7F1F1;
    --eli5: #3E6FA8;
    --eli5-soft: #EAF1F8;
    --tier-acute: #3F8F63;
    --tier-acute-soft: #E8F4EC;
    --tier-recurring: #A8791F;
    --tier-recurring-soft: #FBF1DE;
    --tier-chronic: #AE5230;
    --tier-chronic-soft: #FBEBE3;
    --danger: #B23B3B;
    --danger-soft: #FBEAEA;
    --tier-emergency: #B23B3B;
    --tier-emergency-soft: #FBEAEA;
    --conflict: #8A5C0A;
    --conflict-soft: #FCEFD9;
    --band: #161B22;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; }
  p { margin: 0 0 0.85em 0; }
  p:last-child { margin-bottom: 0; }
  ul { margin: 0; padding-left: 1.25em; }
  li { margin-bottom: 0.45em; }
  li:last-child { margin-bottom: 0; }
  button { font-family: inherit; cursor: pointer; }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Disclaimer band ---------- */
  .disclaimer-band {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--band);
    color: #D7DBE1;
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    padding: 7px 20px;
    text-align: center;
  }
  .disclaimer-band strong { color: #fff; font-weight: 600; }

  /* ---------- Shell ---------- */
  .shell { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }

  .masthead { margin-bottom: 32px; }
  .masthead .eyebrow {
    font-family: var(--mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }
  .masthead h1 { font-size: 2rem; letter-spacing: -0.01em; }
  .masthead .sub { color: var(--text-secondary); font-size: 0.95rem; margin-top: 6px; max-width: 560px; }

  /* ---------- Search ---------- */
  .search-wrap { margin: 28px 0 20px; }
  .search-field {
    display: flex;
    align-items: center;
    border-bottom: 2px solid var(--text);
    padding-bottom: 8px;
    gap: 10px;
  }
  .search-field span { font-family: var(--mono); color: var(--text-tertiary); font-size: 0.9rem; }
  .search-field input {
    border: none;
    background: transparent;
    font-family: var(--serif);
    font-size: 1.2rem;
    color: var(--text);
    width: 100%;
  }
  .search-field input:focus { outline: none; }
  .search-field input::placeholder { color: var(--text-tertiary); font-style: italic; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 0.78rem; color: var(--text-secondary); }
  .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

  /* ---------- Library grid ---------- */
  .library-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--tier-color, var(--accent));
    padding: 18px 18px 16px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 1px 2px rgba(22,27,34,0.04);
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(22,27,34,0.08); }
  .card .ref { font-family: var(--mono); font-size: 0.72rem; color: var(--text-tertiary); letter-spacing: 0.06em; }
  .card h2 { font-size: 1.15rem; line-height: 1.3; }
  .card .teaser { font-size: 0.86rem; color: var(--text-secondary); flex-grow: 1; }
  .card .tag { font-family: var(--mono); font-size: 0.7rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; }
  .card .severity-pill {
    display: inline-block;
    font-family: var(--mono);
    font-size: 0.68rem;
    padding: 3px 8px;
    border-radius: 2px;
    background: var(--tier-soft, var(--accent-soft));
    color: var(--tier-color, var(--accent));
    width: fit-content;
  }
  .card .open-link {
    font-family: var(--mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    align-self: flex-end;
  }

  .no-match { padding: 40px 10px; color: var(--text-secondary); font-size: 0.95rem; max-width: 460px; }
  .no-match strong { color: var(--text); display: block; margin-bottom: 6px; font-family: var(--serif); font-size: 1.1rem; }

  /* ---------- Detail view ---------- */
  .back-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 0;
    margin-bottom: 22px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .back-btn:hover { color: var(--accent); }

  .topic-head { border-bottom: 1px dashed var(--border-strong); padding-bottom: 20px; margin-bottom: 28px; }
  .topic-head .ref-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .topic-head .ref { font-family: var(--mono); font-size: 0.75rem; color: var(--text-tertiary); letter-spacing: 0.06em; }
  .topic-head h1 { font-size: 1.9rem; margin-bottom: 10px; }
  .topic-head .meta-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .severity-pill.lg { font-size: 0.75rem; padding: 4px 10px; }
  .verified { font-family: var(--mono); font-size: 0.72rem; color: var(--text-tertiary); }

  .detail-layout { display: grid; grid-template-columns: 176px 1fr; gap: 36px; align-items: start; }

  .tab-rail { position: sticky; top: 52px; display: flex; flex-direction: column; gap: 2px; }
  .tab-btn {
    background: none;
    border: none;
    border-left: 3px solid transparent;
    text-align: left;
    padding: 8px 10px;
    font-family: var(--sans);
    font-size: 0.82rem;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .tab-btn .code { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.08em; color: var(--text-tertiary); }
  .tab-btn:hover { color: var(--text); background: var(--bg); }
  .tab-btn.active { border-left-color: var(--accent); color: var(--text); font-weight: 600; background: var(--accent-soft); }
  .tab-btn.active .code { color: var(--accent); }

  .sections { display: flex; flex-direction: column; }
  .sect { border-top: 1px dashed var(--border-strong); padding: 22px 0; scroll-margin-top: 64px; }
  .sect:first-child { border-top: none; padding-top: 0; }
  .sect.eli5 { background: var(--eli5-soft); border: 1px solid #D6E4F0; border-radius: 4px; padding: 18px 20px; margin: 4px 0; }
  .sect.eli5:first-child { margin-top: 0; }

  .sect-head {
    background: none;
    border: none;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0;
    text-align: left;
  }
  .sect-head h3 { font-size: 1.15rem; color: var(--text); }
  .sect.eli5 .sect-head h3 { color: var(--eli5); }
  .sect-head .chev { font-family: var(--mono); font-size: 0.85rem; color: var(--text-tertiary); transition: transform 0.15s ease; }
  .sect.expanded .sect-head .chev { transform: rotate(90deg); }

  .sect-teaser { font-size: 0.86rem; color: var(--text-secondary); margin-top: 6px; }
  .sect.expanded .sect-teaser { display: none; }

  .sect-body { display: none; margin-top: 14px; font-size: 0.94rem; color: var(--text); max-width: 68ch; }
  .sect.expanded .sect-body { display: block; }

  .subblock { margin-top: 14px; padding: 12px 14px; border-radius: 3px; border: 1px solid var(--border); }
  .subblock.danger { background: var(--danger-soft); border-color: #EAC7C7; }
  .subblock.danger .subhead { color: var(--danger); }
  .subblock.neutral { background: var(--bg); }
  .subhead { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); margin-bottom: 8px; display: block; }

  .conflict-box {
    margin-top: 14px;
    background: var(--conflict-soft);
    border: 1px solid #EAD3A0;
    border-left: 3px solid var(--conflict);
    padding: 14px 16px;
    border-radius: 3px;
  }
  .conflict-box .conflict-label { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--conflict); font-weight: 700; display: block; margin-bottom: 6px; }
  .conflict-box p { font-size: 0.88rem; color: #5C4212; }

  .dos-donts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 4px; }
  .dos-donts-grid .subhead { margin-bottom: 8px; }

  .source-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .source-list li { font-size: 0.84rem; color: var(--text-secondary); }
  .source-list .org { font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; color: var(--text-tertiary); letter-spacing: 0.04em; margin-right: 6px; }

  .data-table-wrap { margin-top: 16px; max-width: 68ch; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.data-table th {
    text-align: left;
    font-family: var(--mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-tertiary);
    font-weight: 600;
    padding: 0 10px 8px 0;
    border-bottom: 1px solid var(--border-strong);
  }
  table.data-table td {
    padding: 8px 10px 8px 0;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
  }
  table.data-table tr:last-child td { border-bottom: none; }
  table.data-table td:first-child { font-weight: 600; white-space: nowrap; }
  .table-caption { font-size: 0.76rem; color: var(--text-tertiary); margin-top: 8px; font-style: italic; }

  footer.app-footer { margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 0.76rem; color: var(--text-tertiary); font-family: var(--mono); }

  @media (max-width: 720px) {
    .shell { padding: 24px 16px 60px; }
    .detail-layout { grid-template-columns: 1fr; }
    .tab-rail { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    .tab-btn { flex-shrink: 0; border-left: none; border-bottom: 3px solid transparent; }
    .tab-btn.active { border-left: none; border-bottom-color: var(--accent); }
    .dos-donts-grid { grid-template-columns: 1fr; }
    .masthead h1 { font-size: 1.6rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .sect-head .chev { transition: none; }
  }
</style>
</head>

let state = { view: "library", activeTopicId: null };

function tierVars(tier) {
  const map = {
    acute: { color: "var(--tier-acute)", soft: "var(--tier-acute-soft)" },
    recurring: { color: "var(--tier-recurring)", soft: "var(--tier-recurring-soft)" },
    chronic: { color: "var(--tier-chronic)", soft: "var(--tier-chronic-soft)" },
    emergency: { color: "var(--tier-emergency)", soft: "var(--tier-emergency-soft)" }
  };
  return map[tier];
}

function tableHTML(table) {
  if (!table) return "";
  return `<div class="data-table-wrap">
    <table class="data-table">
      <thead><tr>${table.headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${table.rows.map(row => `<tr>${row.map(cell => `<td>${esc(cell)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table>
    ${table.caption ? `<div class="table-caption">${esc(table.caption)}</div>` : ""}
  </div>`;
}

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function teaserOf(text, len) {
  if (text.length <= len) return text;
  return text.slice(0, len).replace(/\s+\S*$/, "") + "…";
}

function renderApp() {
  const shell = document.getElementById("shell");
  if (state.view === "library") {
    shell.innerHTML = libraryHTML();
    attachLibraryEvents();
  } else {
    const topic = TOPICS.find(t => t.id === state.activeTopicId);
    shell.innerHTML = detailHTML(topic);
    attachDetailEvents(topic);
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }
}

function libraryHTML() {
  return `
    <div class="masthead">
      <div class="eyebrow">Personal Reference Library · 24 entries</div>
      <h1>Health Reference</h1>
      <div class="sub">A static, offline library built from major health authorities — WHO, CDC, NHS, Mayo Clinic, and NIH. Search filters what's already here; nothing is fetched live.</div>
    </div>

    <div class="search-wrap">
      <div class="search-field">
        <span>Search</span>
        <input id="search-input" type="text" placeholder="Try “migraine” or “blood pressure”…" autocomplete="off" aria-label="Search health reference library">
      </div>
      <div class="legend">
        <span><span class="dot" style="background:var(--tier-acute)"></span>Acute — self-limiting</span>
        <span><span class="dot" style="background:var(--tier-recurring)"></span>Recurring — episodic</span>
        <span><span class="dot" style="background:var(--tier-chronic)"></span>Chronic — systemic risk</span>
        <span><span class="dot" style="background:var(--tier-emergency)"></span>Emergency — know the signs</span>
      </div>
    </div>

    <div id="library-grid" class="library-grid">
      ${gridHTML(TOPICS)}
    </div>
  `;
}

function gridHTML(topics) {
  if (topics.length === 0) {
    return `<div class="no-match">
      <strong>Not yet in your library.</strong>
      This reference only grows through a dedicated research cycle against WHO, CDC, NHS, Mayo Clinic, and NIH sources — nothing is pulled live. Mention this topic to add it next time.
    </div>`;
  }
  return topics.map(t => {
    const v = tierVars(t.tier);
    return `
      <button class="card" data-id="${t.id}" style="--tier-color:${v.color}; --tier-soft:${v.soft}">
        <div class="ref">${t.ref}</div>
        <h2>${esc(t.title)}</h2>
        <div class="tag">${esc(t.tag)}</div>
        <div class="teaser">${esc(teaserOf(t.sections.understanding, 118))}</div>
        <span class="severity-pill">${esc(t.tierLabel)}</span>
        <span class="open-link">Open →</span>
      </button>
    `;
  }).join("");
}

function attachLibraryEvents() {
  const input = document.getElementById("search-input");
  const grid = document.getElementById("library-grid");
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    const filtered = q === "" ? TOPICS : TOPICS.filter(t =>
      t.title.toLowerCase().includes(q) ||
      t.tag.toLowerCase().includes(q) ||
      t.id.toLowerCase().includes(q)
    );
    grid.innerHTML = gridHTML(filtered);
    bindCardClicks(grid);
  });
  bindCardClicks(grid);
}

function bindCardClicks(container) {
  container.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
      state.view = "detail";
      state.activeTopicId = card.dataset.id;
      renderApp();
    });
  });
}

function listHTML(items) {
  return `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
}

function sectionBodyHTML(topic, defKey) {
  const s = topic.sections;
  const tbl = topic.tables ? tableHTML(topic.tables[defKey]) : "";
  switch (defKey) {
    case "understanding":
      return `<p>${esc(s.understanding)}</p>` + tbl + (topic.conflict ? conflictHTML(topic.conflict) : "");
    case "eli5":
      return `<p>${esc(s.eli5)}</p>` + tbl;
    case "status":
      return `<p>${esc(s.status)}</p>` + tbl;
    case "redFlags": {
      let out = "";
      if (s.redFlags.emergency.length) {
        out += `<div class="subblock danger"><span class="subhead">Seek emergency care</span>${listHTML(s.redFlags.emergency)}</div>`;
      }
      if (s.redFlags.seeDoctor.length) {
        out += `<div class="subblock neutral"><span class="subhead">Contact a doctor</span>${listHTML(s.redFlags.seeDoctor)}</div>`;
      }
      out += tbl;
      out += `<p style="margin-top:14px">${esc(s.redFlags.complications)}</p>`;
      return out;
    }
    case "dosDonts":
      return `<div class="dos-donts-grid">
        <div><span class="subhead">Do</span>${listHTML(s.dos)}</div>
        <div><span class="subhead">Don't</span>${listHTML(s.donts)}</div>
      </div>` + tbl;
    case "nutrition":
      return `<p>${esc(s.nutrition)}</p>` + tbl;
    case "other":
      return `<p>${esc(s.other)}</p>` + tbl;
    case "sources":
      return `<ul class="source-list">${s.sources.map(src =>
        `<li><span class="org">${esc(src.org)}</span>${esc(src.title)} — <a href="${src.url}" target="_blank" rel="noopener noreferrer">${src.url}</a></li>`
      ).join("")}</ul>`;
  }
}

function teaserFor(topic, defKey) {
  const s = topic.sections;
  const map = {
    understanding: s.understanding,
    eli5: s.eli5,
    status: s.status,
    redFlags: s.redFlags.complications,
    dosDonts: s.dos[0] + " …",
    nutrition: s.nutrition,
    other: s.other,
    sources: `${s.sources.length} cited sources`
  };
  return teaserOf(map[defKey], 100);
}

function conflictHTML(c) {
  return `<div class="conflict-box">
    <span class="conflict-label">⚠ ${esc(c.label)}</span>
    <p>${esc(c.detail)}</p>
  </div>`;
}

function detailHTML(topic) {
  const v = tierVars(topic.tier);
  const defaultOpen = "understanding";
  return `
    <button class="back-btn" id="back-btn">← Back to library</button>

    <div class="topic-head">
      <div class="ref-row">
        <span class="ref">${topic.ref}</span>
        <span class="tag">${esc(topic.tag)}</span>
      </div>
      <h1>${esc(topic.title)}</h1>
      <div class="meta-row">
        <span class="severity-pill lg" style="background:${v.soft}; color:${v.color}">${esc(topic.tierLabel)}</span>
        <span class="verified">${esc(topic.verified)}</span>
      </div>
    </div>

    <div class="detail-layout">
      <nav class="tab-rail" aria-label="Section navigation">
        ${SECTION_DEFS.map(d => `
          <button class="tab-btn ${d.key === defaultOpen ? "active" : ""}" data-target="${d.key}">
            <span class="code">${d.code}</span>
            <span>${d.label}</span>
          </button>
        `).join("")}
      </nav>

      <div class="sections">
        ${SECTION_DEFS.map(d => `
          <section class="sect ${d.key === "eli5" ? "eli5" : ""} ${d.key === defaultOpen ? "expanded" : ""}" id="sect-${d.key}" data-key="${d.key}">
            <button class="sect-head" data-key="${d.key}" aria-expanded="${d.key === defaultOpen}">
              <h3>${esc(d.label)}</h3>
              <span class="chev">▸</span>
            </button>
            <div class="sect-teaser">${esc(teaserFor(topic, d.key))}</div>
            <div class="sect-body">${sectionBodyHTML(topic, d.key)}</div>
          </section>
        `).join("")}
      </div>
    </div>
  `;
}

function attachDetailEvents(topic) {
  document.getElementById("back-btn").addEventListener("click", () => {
    state.view = "library";
    renderApp();
  });

  document.querySelectorAll(".sect-head").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.key;
      const sect = document.getElementById("sect-" + key);
      const expanded = sect.classList.toggle("expanded");
      btn.setAttribute("aria-expanded", String(expanded));
      document.querySelectorAll(".tab-btn").forEach(tb => tb.classList.remove("active"));
      const tab = document.querySelector(`.tab-btn[data-target="${key}"]`);
      if (tab) tab.classList.add("active");
    });
  });

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.target;
      const sect = document.getElementById("sect-" + key);
      if (!sect.classList.contains("expanded")) {
        sect.classList.add("expanded");
        const head = sect.querySelector(".sect-head");
        head.setAttribute("aria-expanded", "true");
      }
      document.querySelectorAll(".tab-btn").forEach(tb => tb.classList.remove("active"));
      btn.classList.add("active");
      sect.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
}

renderApp();
</script>

</body>
</html>

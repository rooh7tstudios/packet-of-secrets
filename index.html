<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>packet-of-secrets — Rohit Raj Rajana</title>
<style>
  :root {
    --bg: #0a0e14;
    --card: #131a24;
    --border: #1f2937;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 60px 24px;
    max-width: 800px;
    margin: 0 auto;
  }
  header { margin-bottom: 48px; }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  header p {
    color: var(--muted);
    margin-top: 8px;
    font-size: 15px;
  }
  .grid {
    display: grid;
    gap: 14px;
  }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateX(4px);
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
  }
  .card-desc {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
  footer {
    margin-top: 60px;
    color: var(--muted);
    font-size: 13px;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>packet-of-secrets</h1>
    <p>Network &amp; security engineering artifacts — built and maintained by Rohit Raj Rajana</p>
  </header>

  <div class="grid">
    <a class="card" href="covenant/">
      <div class="card-title">Covenant</div>
      <div class="card-desc">View artifact</div>
    </a>
    <!-- Add more cards below as you push more folders -->
  </div>

  <footer>
    <a href="https://rohitrajana.com">rohitrajana.com</a> · <a href="https://www.linkedin.com/in/rohit7raj">LinkedIn</a>
  </footer>
</body>
</html>
